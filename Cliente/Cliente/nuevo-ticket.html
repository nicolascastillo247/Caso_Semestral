<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/miestilo.css" rel="stylesheet">
</head>
<body>


<header class="main-header border-bottom py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <h1 class="h3 m-0 brand-title">Chibson Instruments</h1>
            <nav aria-label="Navegación principal">
                <ul class="nav">
                    <li class="nav-item"><a href="inicio-cliente.html" class="nav-link px-2">Inicio</a></li>
                    <li class="nav-item"><span class="nav-link px-2 nav-static">Catálogo</span></li>
                    <li class="nav-item"><a href="carrito.html" class="nav-link px-2">Carro</a></li>
                    <li class="nav-item"><a href="mis-pedidos.html" class="nav-link px-2">Mis pedidos</a></li>
                    <li class="nav-item"><a href="mis-devoluciones.html" class="nav-link px-2">Devoluciones</a></li>
                    <li class="nav-item"><a href="mis-tickets.html" class="nav-link px-2 active fw-bold">Soporte</a></li>
                    <li class="nav-item"><a href="mi-perfil.html" class="nav-link px-2">Mi perfil</a></li>
                </ul>
            </nav>
        </div>
    </header>



<main class="container my-5">
    <h1 class="display-6 fw-bold mb-4">Crear solicitud de soporte</h1>

    <div class="card section-card shadow-sm p-4">
        <form id="form-ticket" novalidate onsubmit="crearTicket(event)">
            <div class="mb-3">
                <label for="categoria" class="form-label">Categoría</label>
                <select id="categoria" class="form-select" required>
                    <option value="">Seleccione</option>
                    <option>Pedido</option>
                    <option>Pago</option>
                    <option>Despacho</option>
                    <option>Garantía</option>
                    <option>Otro</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="asunto" class="form-label">Asunto</label>
                <input id="asunto" class="form-control" type="text" required>
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label">Descripción</label>
                <textarea id="mensaje" class="form-control" rows="6" required></textarea>
            </div>

            <div class="mb-3">
                <label for="archivo" class="form-label">Adjuntar archivo</label>
                <input id="archivo" class="form-control" type="file">
            </div>

            <button type="submit" class="btn btn-custom">Enviar ticket</button>
        </form>
    </div>
</main>



<footer class="border-top py-4 text-center text-muted small bg-white mt-5">
    <p class="mb-0">&copy; 2026 Chibson Instruments. Todos los derechos reservados.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script src="js/cliente.js"></script>
</body>
</html>
