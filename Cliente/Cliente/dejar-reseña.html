<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/miestilo.css" rel="stylesheet">
</head>
<body>


<header class="main-header border-bottom py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <h1 class="h3 m-0 brand-title">Chibson Instruments</h1>
            <nav aria-label="Navegación principal">
                <ul class="nav">
                    <li class="nav-item"><a href="inicio-cliente.html" class="nav-link px-2">Inicio</a></li>
                    <li class="nav-item"><span class="nav-link px-2 nav-static">Catálogo</span></li>
                    <li class="nav-item"><a href="carrito.html" class="nav-link px-2">Carro</a></li>
                    <li class="nav-item"><a href="mis-pedidos.html" class="nav-link px-2 active fw-bold">Mis pedidos</a></li>
                    <li class="nav-item"><a href="mis-devoluciones.html" class="nav-link px-2">Devoluciones</a></li>
                    <li class="nav-item"><a href="mis-tickets.html" class="nav-link px-2">Soporte</a></li>
                    <li class="nav-item"><a href="mi-perfil.html" class="nav-link px-2">Mi perfil</a></li>
                </ul>
            </nav>
        </div>
    </header>



<main class="container my-5">
    <h1 class="display-6 fw-bold mb-4">Dejar reseña</h1>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card product-card shadow-sm border-0 p-4 text-center">
                <img src="img/guitarra.png" alt="Teclado" class="img-fluid mb-3">
                <h2 class="h5 fw-bold">Guitarra Eléctrica Standard Custom</h2>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card section-card shadow-sm p-4">
                <div id="mensaje-resena" class="alert alert-success d-none">Reseña publicada correctamente.</div>
                <form id="form-resena" novalidate onsubmit="publicarResena(event)">
                    <div class="mb-3">
                        <label for="calificacion" class="form-label">Calificación</label>
                        <select id="calificacion" class="form-select" required>
                            <option value="">Seleccione</option>
                            <option>5 - Excelente</option>
                            <option>4 - Muy bueno</option>
                            <option>3 - Bueno</option>
                            <option>2 - Regular</option>
                            <option>1 - Malo</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título</label>
                        <input id="titulo" class="form-control" type="text">
                    </div>

                    <div class="mb-3">
                        <label for="resena" class="form-label">Comentario</label>
                        <textarea id="resena" class="form-control" rows="6" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-custom">Publicar reseña</button>
                </form>
            </div>
        </div>
    </div>
</main>



<footer class="border-top py-4 text-center text-muted small bg-white mt-5">

</footer>

</body>
</html>
