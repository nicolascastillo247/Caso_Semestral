    <link href="css/miestilo.css" rel="stylesheet">
</head>
<body>


<header class="main-header border-bottom py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <h1 class="h3 m-0 brand-title">Chibson Instruments</h1>
            <nav aria-label="Navegación principal">
                <ul class="nav">
                    <li class="nav-item"><a href="inicio-cliente.html" class="nav-link px-2">Inicio</a></li>
                    <li class="nav-item"><span class="nav-link px-2 nav-static">Catálogo</span></li>
                    <li class="nav-item"><a href="carrito.html" class="nav-link px-2">Carro</a></li>
                    <li class="nav-item"><a href="mis-pedidos.html" class="nav-link px-2">Mis pedidos</a></li>
                    <li class="nav-item"><a href="mis-devoluciones.html" class="nav-link px-2 active fw-bold">Devoluciones</a></li>
                    <li class="nav-item"><a href="mis-tickets.html" class="nav-link px-2">Soporte</a></li>
                    <li class="nav-item"><a href="mi-perfil.html" class="nav-link px-2">Mi perfil</a></li>
                </ul>
            </nav>
        </div>
    </header>



<main class="container my-5">
    <h1 class="display-6 fw-bold mb-4">Solicitar devolución</h1>

    <div class="card section-card shadow-sm border-0 p-4">
        <form id="form-devolucion" novalidate onsubmit="crearDevolucion(event)">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="pedido" class="form-label">Pedido</label>
                    <select id="pedido" class="form-select" required>
                        <option value="">Seleccione</option>
                        <option>Pedido #0002</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="producto" class="form-label">Producto</label>
                    <select id="producto" class="form-select" required>
                        <option value="">Seleccione</option>
                        <option>Guitarra Eléctrica Standard Custom</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="motivo" class="form-label">Motivo</label>
                    <select id="motivo" class="form-select" required>
                        <option value="">Seleccione</option>
                        <option>Producto defectuoso</option>
                        <option>Producto dañado</option>
                        <option>Producto incorrecto</option>
                        <option>Otro</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="evidencia" class="form-label">Evidencia</label>
                    <input id="evidencia" type="file" class="form-control" accept="image/*" required>
                </div>

                <div class="col-12">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea id="descripcion" class="form-control" rows="5" required></textarea>
                </div>
            </div>

            <button type="submit" class="btn btn-custom mt-4">Enviar solicitud</button>
        </form>
    </div>
</main>



<footer class="border-top py-4 text-center text-muted small bg-white mt-5">

</body>
