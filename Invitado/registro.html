<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario - Chibson Instruments</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <link href="css/miestilo.css" rel="stylesheet">
</head>

<body>


    <header class="main-header border-bottom py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <h1 class="h3 m-0 brand-title">Chibson Instruments</h1>
            <nav aria-label="Navegación principal">
                <ul class="nav">
                    <li class="nav-item"><a href="index.html" class="nav-link px-2">Inicio</a></li>
                    <li class="nav-item"><a href="catalogo.html" class="nav-link px-2">Catálogo</a></li>
                    <li class="nav-item"><a href="nosotros.html" class="nav-link px-2">Nosotros</a></li>
                    <li class="nav-item"><a href="login.html" class="nav-link px-2">Iniciar Sesión</a></li>
                    <li class="nav-item"><a href="registro.html" class="nav-link px-2 active fw-bold">Registrarse</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

      
                <div class="card p-4 p-md-5 shadow-sm border-0 product-card">
                    <form action="registro.html" method="post">
                        <fieldset>
                            <legend class="text-center mb-4">
                                <h2 class="h3 fw-bold">Registro de usuario</h2>
                                <p class="text-muted small">Crea tu cuenta para comprar instrumentos y gestionar tus pedidos</p>
                            </legend>

      
                            <div class="row g-3 mb-3">
                                <div class="col-12 col-sm-6">
                                    <label for="first_name" class="form-label fw-semibold">Nombre:</label>
                                    <input type="text" class="form-control" id="first_name" name="first_name" required placeholder="Ej. Juan">
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label for="last_name" class="form-label fw-semibold">Apellido:</label>
                                    <input type="text" class="form-control" id="last_name" name="last_name" required placeholder="Ej. Pérez">
                                </div>
                            </div>

   
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Correo electrónico:</label>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="correo@ejemplo.com">
                            </div>

               
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Contraseña:</label>
                                <input type="password" class="form-control" id="password" name="password" minlength="8" required placeholder="Mínimo 8 caracteres">
                            </div>

        
                            <div class="mb-4">
                                <label for="confirm_password" class="form-label fw-semibold">Confirmar contraseña:</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="8" required placeholder="Repite tu contraseña">
                            </div>
                        </fieldset>

     
                        <button type="submit" class="btn btn-custom w-100 py-2">Registrarse</button>
                    </form>

                    <hr class="custom-divider my-4">

                    <div class="text-center small">
                        <p class="mb-0">¿Ya tienes una cuenta? <a href="login.html" class="text-link fw-semibold">Inicia sesión aquí</a></p>
                    </div>
                </div>

            </div>
        </div>
    </main>


    <footer class="border-top py-4 text-center text-muted small bg-white mt-5">
        <p class="mb-0">&copy; 2026 Chibson Instruments. Todos los derechos reservados.</p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script>
        const inputContraseña = document.getElementById('password');
        const inputConfirmarContraseña = document.getElementById('confirm_password');

        function validarContraseña() {
            if (inputContraseña.value !== inputConfirmarContraseña.value) {
                inputConfirmarContraseña.setCustomValidity("Las contraseñas no coinciden.");
            } else {
                inputConfirmarContraseña.setCustomValidity("");
            }
        }

        inputContraseña.addEventListener('input', validarContraseña);
        inputConfirmarContraseña.addEventListener('input', validarContraseña);
    </script>
</body>

</html>
