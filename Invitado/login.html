<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - Chibson Instruments</title>

  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

 
    <link href="css/miestilo.css" rel="stylesheet">
</head>

<body>

  
    <header class="main-header border-bottom py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <h1 class="h3 m-0 brand-title">Chibson Instruments</h1>
            <nav aria-label="Navegación principal">
                <ul class="nav">
                    <li class="nav-item"><a href="index.html" class="nav-link px-2">Inicio</a></li>
                    <li class="nav-item"><a href="catalogo.html" class="nav-link px-2">Catálogo</a></li>
                    <li class="nav-item"><a href="noticias.html" class="nav-link px-2">Noticias</a></li>
                    <li class="nav-item"><a href="nosotros.html" class="nav-link px-2">Nosotros</a></li>
                    <li class="nav-item"><a href="login.html" class="nav-link px-2 active fw-bold">Iniciar Sesión</a></li>
                    <li class="nav-item"><a href="registro.html" class="nav-link px-2">Registrarse</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
          
                <div class="card p-4 p-md-5 shadow-sm border-0 product-card">
                    <form action="login.html" method="post">
                        <fieldset>
                            <legend class="text-center mb-4">
                                <h2 class="h3 fw-bold">Inicio de sesión</h2>
                                <p class="text-muted small">Ingresa tus credenciales para acceder a tu cuenta</p>
                            </legend>

             
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="nombre@ejemplo.com" required>
                            </div>

    
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Contraseña</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </fieldset>

 
                        <button type="submit" class="btn btn-custom w-100 py-2">Iniciar Sesión</button>
                    </form>

                    <hr class="custom-divider my-4">


            
                    <div class="text-center small">
                        <p class="mb-2">¿No tienes una cuenta? <a href="registro.html" class="text-link">Regístrate aquí</a></p>
                        <p class="mb-0"><a href="recuperar_contraseña.html" class="text-link">¿Olvidaste tu contraseña?</a></p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
